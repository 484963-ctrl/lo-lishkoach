name: Build APK

# בונה את האפליקציה לטלפון בכל עדכון, ומפרסם אותה בקישור קבוע:
# https://github.com/484963-ctrl/lo-lishkoach/releases/latest/download/lo-lishkoach.apk
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build APK
        run: ./scripts/build-apk.sh
        env:
          VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: lo-lishkoach-apk
          path: lo-lishkoach.apk
          if-no-files-found: error
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: לא לשכוח – הגרסה האחרונה
          body: גרסה 1.${{ github.run_number }}, נבנתה מ-${{ github.sha }}. מורידים את lo-lishkoach.apk ומתקינים.
          files: lo-lishkoach.apk
          make_latest: true
