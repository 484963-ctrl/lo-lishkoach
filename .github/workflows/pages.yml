name: Website

# האתר (גם למחשב): https://484963-ctrl.github.io/lo-lishkoach/
# פעם אחת צריך להפעיל: Settings → Pages → Source: GitHub Actions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [www/**, scripts/write-version.mjs, scripts/release-name.mjs, .github/workflows/pages.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # מספר הגרסה וזמן העדכון, לדף המידע ולמסך ההגדרות
      - run: node scripts/write-version.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
